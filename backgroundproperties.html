<!doctype html>
<html>
<head>
<title> Background properties</title>
<style>
div{
width:100%;
height:100px;
margin:5px;
color:white;
text-align:center;
line-height:150px;
font-size:100px;
border:10px dotted blue;
}
.div1{
background-color:light blue;
color:green;
}
.div2{
background:linear-gradient(to left,red,yellow);
color:black;
}
.div3{
background-image:url("flower.jpg");
background-size:contain;
background-repeat:no-repeat;
background-position:center;
color:red;
}
</style>
</head>
<body>
<div class="div1"> winners</div>
<div class="div2"> winners</div>
<div class="div3"> winners</div>
</body>
</html>
