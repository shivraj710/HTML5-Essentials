<!doctype html>
<html>
    <head>
        <title> using classes </title>
        <style>
            .income{background:#0ff;}
            .expenses{background:#f0f;}
            .profit{background:#00f;}
        </style>
    </head>
    <body>
        <p> The <span class="income">income</span> is more than <span class="expenses">expenses</span>, so there is <span class="profit">profit</span></p>
    </body>
</html>
