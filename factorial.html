<!doctype html>
<html>
    <head>
        <title> factorial </title>
    </head>
    <body>
        <script>
            let n=Number(prompt("Enter a number : "));
            let fact=1;
            for(i=1; i<=n; i++)
        {
            fact=fact*i;
        }
        document.write("factorial of" ,n , "is" ,fact);
        </script>
        </body>
        </html>
