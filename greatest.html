<!doctype html>
<html>
    <head>
        <title> Greatest of three numbers </title>
    </head>
    <body>
        <script>
            let a = Number(prompt("Enter the first number"));
            let b = Number(prompt("Enter the second number"));
            let c = Number(prompt("Enter the third number"));

            document.write("Entered numbers are: "+a+ "" +b+ "" +c);
            document.write("<br>");

            if(a>=b && a>=c){
                document.write(a+ "is greatest");
            }
            if(b>=a && b>=c){
                document.write(b+ "is greatest");
            }
            else{
                document.write(c+ "is greatest");
            }
         </script>
    </body>
</html>
