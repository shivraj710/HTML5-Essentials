<!DOCTYPE html>
<html>
    <head>
        <title>
            iframe example </title>
            <style>
                .container{
                    display:flex;
                    gap:10px;
                }
                .section{
                    width:50%;
                    height:400px:
                }
                iframe{
                    width:100%;
                    height:100%;
                    border:1px solid black;
                }
                </style>
                </head>
                <body>
                    <h2> website using iframe </h2>
                    <div class="container">
                        <div class="section">
                            <iframe src="https://www.google.com"></iframe>
                        </div>
                        <div class="section">
                            <iframe src="https://github.io"></iframe>
                        </div>
                    </div>
                </body>

</html>
