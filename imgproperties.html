<!doctype html>
<html>
    <head>
        <title> image properties </title>
        <style>
            img{
                width:180px;
                height:180px;
                margin:10px;
            }
            .round{
                border:5px dotted red;
                border-radius:10px;
            }
            .circle{
                border:5px double blue;
                border-radius:1000%;
            }
        </style>
    </head>
    <body>
        <h5> square image </h5>
        <img src="flower.jpg" class="round"><br>
        <h5> circle image </h5>
        <img src="flower.jpg" class="circle">
    </body>
</html>
